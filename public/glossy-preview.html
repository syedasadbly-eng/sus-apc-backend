<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUS — Glossy Platinum Preview</title><style>body{margin:0;background:#111;color:#eee;font:12px Arial,sans-serif}header{height:44px;display:flex;align-items:center;gap:20px;padding:0 18px;box-sizing:border-box;background:linear-gradient(#303237,#090a0c);border-bottom:1px solid #555}button{background:#eee;color:#111;border:1px solid #aaa;border-radius:5px;padding:5px 12px;cursor:pointer}iframe{display:block;width:100%;height:calc(100dvh - 44px);border:0}#state{color:#c5c8cd}</style></head><body><header><strong>SUS / GLOSSY PLATINUM PREVIEW</strong><button id="toggle">Show original</button><span id="state">Existing dashboard and authentication · connected controls remain active</span></header><iframe id="app" title="Actual APC dashboard with preview styling" src="./"></iframe><script>
const css=`
:root,[data-theme]{--color-bg:#f0f1f3!important;--color-surface:#fff!important;--color-surface-2:#f1f2f4!important;--color-surface-3:#e5e7eb!important;--color-surface-offset:#f5f6f8!important;--color-divider:#d9dce1!important;--color-border:#c7ccd3!important;--color-text:#16191f!important;--color-text-muted:#535c68!important;--color-text-faint:#626c79!important;--color-text-inverse:#fff!important;--chart-1:#2563eb!important;--chart-2:#0d9488!important;--chart-3:#d97706!important;--chart-4:#7c3aed!important;--chart-5:#db2777!important;--chart-6:#0891b2!important;color-scheme:light!important}
body .main{background:radial-gradient(ellipse at 45% 0,#fff 0,transparent 65%),#edf0f3!important}
body .sidebar,body .header{background:linear-gradient(115deg,#08090b 0%,#2d3035 42%,#101114 65%,#070809 100%)!important;--color-text:#f6f7f9!important;--color-text-muted:#c0c6ce!important;--color-text-faint:#a1a9b4!important;--color-divider:#3b3e44!important;--color-surface:#17191d!important;--color-surface-2:#30343b!important;--color-surface-3:#363b43!important;--color-border:#525862!important;box-shadow:inset -1px 0 0 #ffffff24,0 4px 18px #0002!important}
body .sidebar .logo-text,body .header-title{color:#fff!important}body .sidebar .nav-item{color:#bfc6d0!important}body .sidebar .nav-item.active{background:linear-gradient(#ffffff27,#ffffff0c)!important;color:#fff!important;border:1px solid #ffffff30;box-shadow:inset 0 1px #ffffff25}body .sidebar .nav-item:hover{background:#ffffff18!important;color:white!important}
body #view-overview .kpi-card,body .kpi-card{background:linear-gradient(125deg,#ffffffd9 0%,#ffffff35 34%,transparent 35%),linear-gradient(180deg,#f8f9fb 0%,#d5d9df 49%,#c4cad2 50%,#e6e9ee 100%)!important;border:1px solid #b9c0c9!important;border-radius:15px!important;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 #fff9,0 8px 20px #18212f12!important;transition:transform .22s,box-shadow .22s!important}
body .kpi-card:hover{transform:translateY(-3px);box-shadow:inset 0 1px #fff,0 14px 24px #18212f24!important}body .kpi-card::before{background:linear-gradient(90deg,transparent,#fff,transparent)!important;height:1px!important;animation:none!important}body .kpi-card::after{display:none!important}body .kpi-card .kpi-value{color:#11151b!important;font-size:clamp(28px,2.4vw,40px)!important;letter-spacing:-1px;text-shadow:0 1px #fff9}body .kpi-card .kpi-label{color:#343d49!important}body .kpi-card .kpi-sub{color:#4e5866!important}
body .chart-panel{background:linear-gradient(140deg,#fff,#fbfcfe)!important;border:1px solid #d1d6dd!important;border-radius:16px!important;box-shadow:inset 0 1px #fff,0 8px 25px #18212f0b!important}body .chart-header{background:linear-gradient(#fff,#f2f4f7)!important;border-bottom:1px solid #e0e4e9!important}body .chart-title{color:#1c222b!important}body .chart-subtitle{color:#626c79!important}body .period-tab.active{background:linear-gradient(#343b46,#12161c)!important;color:#fff!important}body .leaflet-tile-pane{filter:none!important}body #occGaugeValue{color:#171d27!important}body #occGaugeLabel{color:#626c79!important}body .login-screen{background:radial-gradient(ellipse at top,#3b3e44,#08090b 75%)!important}body .login-card{background:linear-gradient(145deg,#fff,#e7eaf0)!important;border:1px solid #ffffffaa!important;box-shadow:0 30px 90px #0008,inset 0 1px #fff!important;border-radius:20px!important}*:focus-visible{outline:2px solid #2563eb!important;outline-offset:3px}@media(prefers-reduced-motion:reduce){body .kpi-card{transition:none!important}body .kpi-card:hover{transform:none!important}}
`;
let enabled=true;const frame=document.getElementById('app');function apply(){try{const d=frame.contentDocument;if(!d)return;let s=d.getElementById('sus-gloss-preview');if(!s){s=d.createElement('style');s.id='sus-gloss-preview';s.textContent=css;d.head.appendChild(s)}s.disabled=!enabled}catch(e){document.getElementById('state').textContent='Preview requires same-origin hosting; dashboard framing may be restricted.'}}frame.addEventListener('load',apply);document.getElementById('toggle').onclick=function(){enabled=!enabled;apply();this.textContent=enabled?'Show original':'Show glossy preview'};
</script></body></html>
